<script>
(() => {
  const sheet = document.getElementById("moreSheet");
  document.getElementById("moreBtn").onclick = () => { sheet.hidden = !sheet.hidden; };
  sheet.onclick = e => { if (e.target === sheet || e.target.tagName === "A") sheet.hidden = true; };
  const sync = () => {
    const r = (location.hash.split("/")[1] || "");
    const k = r === "game" ? "games" : r === "player" ? "players" : r;
    document.querySelectorAll(".tabbar a").forEach(a => a.classList.toggle("on", a.dataset.r === k));
    document.getElementById("moreBtn").classList.toggle("on", ["roster", "news", "guide"].includes(k));
  };
  addEventListener("hashchange", sync); sync();
  let deferred;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; document.getElementById("installBtn").hidden = false; });
  document.getElementById("installBtn").onclick = async () => { if (deferred) { deferred.prompt(); deferred = null; } };
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (/iPhone|iPad/.test(navigator.userAgent) && !standalone) document.getElementById("iosHint").hidden = false;
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
